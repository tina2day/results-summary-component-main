<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./src/css/index.css">
  <title>Frontend Mentor | Results summary component</title>

</head>
<body>
  <dialog class="popup">
    <div class="popup__content">
      <form class="popup__form" name="popup">
        <label class="popup__title">Add result</label>
        <label class="popup__item" for="category">Category
          <input type="text" class="popup__category" id="category" placeholder="Category name" title="Введите название категории" required>
          <span id="category-error" hidden></span>
        </label>
        <label class="popup__item" for="score">Score
          <input type="number" class="popup__score" id="score" placeholder="Score name" title="Введите количество баллов" required>
          <span id="score-error" hidden></span>
        </label>
        <label class="popup__item" for="icon">Path
          <input type="text" class="popup__icon" id="icon" placeholder="Icon path" title="Введите путь к иконке" required>
          <span id="icon-error" hidden></span>
        </label>
        <button class="popup__button-add" type="submit" disabled>Add result</button>
      </form>
    </div>
  </dialog>
  <main class="page" hidden>
    <section class="content">
      <div class="result">
        <h1 class="result__title">Your Result</h1>
        <div class="display">
          <h2 class="display__number" id="average-score">0</h2>
          <p class="display__description">of 100</p>
        </div>
        <h3 class="result__name">Great</h3>
        <p class="result__explanation">You scored higher than 65% of the people
           who have taken these tests.</p>
      </div>
      <div class="summary">
        <h2 class="summary__title">Summary</h2>
        <div class="analysis" id="analysis">
        </div>
        <button class="summary__button">Continue</button>
      </div>
    </section>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">tina Tutty</a>.
  </footer>
  <script src="./src/js/main.js" type="module"></script>
</body>
</html>
