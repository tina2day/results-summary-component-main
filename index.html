<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./src/css/index.css">
  <title>Frontend Mentor | Results summary component</title>

</head>
<body>
  <main class="page">
    <section class="content">
      <div class="result">
        <h1 class="result__title">Your Result</h1>
        <div class="display">
          <h2 class="display__number">76</h2>
          <p class="display__description">of 100</p>
        </div>
        <h3 class="result__name">Great</h3>
        <p class="result__explanation">You scored higher than 65% of the people
           who have taken these tests.</p>
      </div>
      <div class="summary">
        <h1 class="summary__title">Summary</h1>
        <div class="analysis">
          <div class="analysis__item">
            <img alt="Реакция" src="./src/assets/images/icon-reaction.svg">
            <h3>Reaction</h3>
            <p>80 <span> / 100</span></p>
          </div>
          <div class="analysis__item">
            <img alt="Память" src="./src/assets/images/icon-memory.svg">
            <h3>Memory</h3>
            <p>92 <span> / 100</span></p>
          </div>
          <div class="analysis__item">
            <img alt="Вербальные навыки" src="./src/assets/images/icon-verbal.svg">
            <h3>Verbal</h3>
            <p>61 <span> / 100</span></p>
          </div>
          <div class="analysis__item">
            <img alt="Визуализация" src="./src/assets/images/icon-visual.svg">
            <h3>Visual</h3>
            <p>72 <span> / 100</span></p>
          </div>
        </div>
        <div class="summary__button"><h3>Continue</h3><button></button></div>
      </div>
    </section>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
